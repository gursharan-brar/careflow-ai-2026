<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareFlow AI - Staff Login</title>
  <link rel="stylesheet" href="/frontend/theme.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-error {
      color: var(--c-error);
      font-size: 14px;
      margin-bottom: 18px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <span class="site-nav-logo"><img src="/frontend/logo.svg" alt="CareFlow AI logo" style="width:26px; height:26px; border-radius:50%; box-shadow:0 2px 6px rgba(0,0,0,0.18); display:block;">CareFlow AI</span>
    <a href="/" class="site-nav-back">← Back to Home</a>
  </nav>
  <div class="container">

    <h1>Staff Login</h1>
    <p class="subtitle">Sign in to access the CareFlow AI dashboard</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username">
        <span class="error" id="username-error"></span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password">
        <span class="error" id="password-error"></span>
      </div>

      <p class="form-error" id="form-error"></p>

      <button type="submit" id="submit-btn">Log In</button>
    </form>

  </div>

  <script>
    const API_URL = "";
    let dashboardUrl = "http://localhost:3000";

    fetch(`${API_URL}/api/config`)
      .then((response) => response.json())
      .then((data) => {
        if (data.dashboard_url) {
          dashboardUrl = data.dashboard_url;
        }
      })
      .catch(() => {});

    const form = document.getElementById("login-form");
    const submitBtn = document.getElementById("submit-btn");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const formError = document.getElementById("form-error");

    function setFieldError(input, message) {
      const errorEl = document.getElementById(`${input.id}-error`);
      errorEl.textContent = message;
      input.classList.toggle("invalid", !!message);
    }

    function validateForm() {
      let valid = true;

      if (!usernameInput.value.trim()) {
        setFieldError(usernameInput, "Username is required");
        valid = false;
      } else {
        setFieldError(usernameInput, "");
      }

      if (!passwordInput.value) {
        setFieldError(passwordInput, "Password is required");
        valid = false;
      } else {
        setFieldError(passwordInput, "");
      }

      return valid;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      formError.textContent = "";

      if (!validateForm()) {
        return;
      }

      submitBtn.disabled = true;

      try {
        const response = await fetch(`${API_URL}/api/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            username: usernameInput.value.trim(),
            password: passwordInput.value,
          }),
        });

        if (!response.ok) {
          formError.textContent = "Invalid username or password.";
          submitBtn.disabled = false;
          return;
        }

        window.location.href = dashboardUrl;
      } catch (err) {
        formError.textContent = "We couldn't reach the server. Please check your connection and try again.";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
