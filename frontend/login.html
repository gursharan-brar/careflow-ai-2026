<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareFlow AI - Staff Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 76px 16px 16px;
      font-size: 16px;
    }

    .container {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      padding: 32px 24px;
      max-width: 440px;
      width: 100%;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 4px;
      color: #0f172a;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 24px;
      font-size: 16px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 16px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      min-height: 44px;
      background: #fff;
      color: #1e293b;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    input.invalid {
      border-color: #ef4444;
    }

    .error {
      display: block;
      color: #ef4444;
      font-size: 14px;
      margin-top: 4px;
      min-height: 18px;
    }

    .form-error {
      color: #ef4444;
      font-size: 14px;
      margin-bottom: 18px;
      min-height: 18px;
    }

    button,
    .button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      min-height: 44px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }

    button:hover,
    .button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <nav style="background:#1B3A6B; padding:14px 32px; display:flex; align-items:center; justify-content:space-between; position:fixed; top:0; left:0; right:0; z-index:100; box-sizing:border-box;">
    <span style="color:white; font-weight:700; font-size:18px; font-family:Inter,sans-serif;">CareFlow AI</span>
    <a href="/" style="color:white; font-size:14px; font-family:Inter,sans-serif; text-decoration:none; border:1px solid rgba(255,255,255,0.4); padding:8px 16px; border-radius:6px;">← Back to Home</a>
  </nav>
  <div class="container">

    <h1>Staff Login</h1>
    <p class="subtitle">Sign in to access the CareFlow AI dashboard</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username">
        <span class="error" id="username-error"></span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password">
        <span class="error" id="password-error"></span>
      </div>

      <p class="form-error" id="form-error"></p>

      <button type="submit" id="submit-btn">Log In</button>
    </form>

  </div>

  <script>
    const API_URL = "";
    let dashboardUrl = "http://localhost:3000";

    fetch(`${API_URL}/api/config`)
      .then((response) => response.json())
      .then((data) => {
        if (data.dashboard_url) {
          dashboardUrl = data.dashboard_url;
        }
      })
      .catch(() => {});

    const form = document.getElementById("login-form");
    const submitBtn = document.getElementById("submit-btn");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const formError = document.getElementById("form-error");

    function setFieldError(input, message) {
      const errorEl = document.getElementById(`${input.id}-error`);
      errorEl.textContent = message;
      input.classList.toggle("invalid", !!message);
    }

    function validateForm() {
      let valid = true;

      if (!usernameInput.value.trim()) {
        setFieldError(usernameInput, "Username is required");
        valid = false;
      } else {
        setFieldError(usernameInput, "");
      }

      if (!passwordInput.value) {
        setFieldError(passwordInput, "Password is required");
        valid = false;
      } else {
        setFieldError(passwordInput, "");
      }

      return valid;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      formError.textContent = "";

      if (!validateForm()) {
        return;
      }

      submitBtn.disabled = true;

      try {
        const response = await fetch(`${API_URL}/api/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            username: usernameInput.value.trim(),
            password: passwordInput.value,
          }),
        });

        if (!response.ok) {
          formError.textContent = "Invalid username or password.";
          submitBtn.disabled = false;
          return;
        }

        window.location.href = dashboardUrl;
      } catch (err) {
        formError.textContent = "We couldn't reach the server. Please check your connection and try again.";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
